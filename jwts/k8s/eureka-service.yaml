apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: jwts
spec:
  type: NodePort
  selector:
    app: eureka-service
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: jwts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-service
  template:
    metadata:
      labels:
        app: eureka-service
    spec:
      containers:
        - name: eureka-service
          image: jwts/eureka-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 180
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 300
            periodSeconds: 20
