server:
  port: 9011
spring:
  profiles:
    active: k8s
  application:
    name: student-client
feign:
  hystrix:
    enabled: true
ribbon:
  eureka:
    enable: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 5
    instance:
      prefer-ip-address: true
      lease-renewal-interval-in-seconds: 5 #续约间隔时间
      lease-expiration-duration-in-seconds: 15 #续约到期
#    service-url:
#      defaultZone: http://localhost:8888/eureka
