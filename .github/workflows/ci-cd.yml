# GitHub Actions CI/CD 工作流
# 自动构建、测试并部署微服务到 K8s 集群

name: JWTS CI/CD Pipeline

# 触发条件：推送到 main 分支或创建 Pull Request
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 环境变量
env:
  # 镜像仓库前缀（替换为你的 Docker Hub 用户名）
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # K8s 集群配置
  K8S_HOST: ${{ secrets.K8S_HOST }}
  K8S_USERNAME: ${{ secrets.K8S_USERNAME }}
  K8S_KEY: ${{ secrets.K8S_SSH_KEY }}

# 任务定义
jobs:
  # 任务1：构建并测试
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 构建所有服务
      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      # 上传构建产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jwts-jars
          path: |
            */target/*.jar
          retention-days: 1

  # 任务2：构建 Docker 镜像
  build-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - eureka-service
          - gateway-service
          - student-service
          - teacher-service
          - course-service
          - student-client
          - teacher-client
          - course-client
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 下载构建产物
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jwts-jars

      # 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jwts-${{ matrix.service }}:latest

  # 任务3：部署到 K8s（仅在 main 分支触发）
  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 配置 SSH
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.K8S_SSH_KEY }}

      # 添加 K8s 主机到 known_hosts
      - name: Add K8s host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.K8S_HOST }} >> ~/.ssh/known_hosts

      # 部署到 K8s
      - name: Deploy to Kubernetes
        run: |
          # 更新镜像版本
          ssh ${{ secrets.K8S_USERNAME }}@${{ secrets.K8S_HOST }} << 'EOF'
            # 拉取最新镜像
            for service in eureka-service gateway-service student-service teacher-service course-service student-client teacher-client course-client; do
              nerdctl --namespace k8s.io pull ${{ secrets.DOCKER_USERNAME }}/jwts-${service}:latest
              nerdctl --namespace k8s.io tag ${{ secrets.DOCKER_USERNAME }}/jwts-${service}:latest jwts/${service}:v1.0
            done

            # 重启所有部署
            kubectl rollout restart deployment -n jwts
          EOF

      # 验证部署状态
      - name: Verify deployment
        run: |
          ssh ${{ secrets.K8S_USERNAME }}@${{ secrets.K8S_HOST }} << 'EOF'
            echo "=== 等待部署完成 ==="
            kubectl rollout status deployment -n jwts --timeout=300s

            echo ""
            echo "=== Pod 状态 ==="
            kubectl get pods -n jwts -o wide

            echo ""
            echo "=== Service 状态 ==="
            kubectl get svc -n jwts
          EOF

  # 任务4：通知（可选）
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ 部署成功！"
          else
            echo "❌ 部署失败，请检查日志"
          fi
