name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jwts

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Tests
        run: mvn test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          # 定义服务列表
          SERVICES="eureka-service student-service teacher-service course-service student-client teacher-client course-client gateway-service"

          # 将镜像名称转换为小写
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          for SERVICE in $SERVICES; do
            echo "Building $SERVICE..."

            # 查找 jar 文件
            JAR_FILE=$(find $SERVICE/target -name "*.jar" -not -name "*-sources.jar" | head -1)

            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: No jar file found for $SERVICE"
              exit 1
            fi

            echo "Found jar: $JAR_FILE"

            # 复制 jar 文件到 Dockerfile 目录
            cp "$JAR_FILE" "jwts/$SERVICE/$SERVICE.jar"

            # 构建镜像
            docker build -t $REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest jwts/$SERVICE/

            # 推送镜像
            docker push $REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest

            echo "$SERVICE pushed successfully!"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            */target/*.jar
          retention-days: 7
