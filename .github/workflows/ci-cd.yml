name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jwts
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        run: |
          if ! command -v java >/dev/null 2>&1; then
            echo "Installing JDK 8..."
            sudo apt-get update
            sudo apt-get install -y openjdk-8-jdk
          fi

          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH
          /usr/lib/jvm/java-8-openjdk-amd64/bin/java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Tests
        run: mvn test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker images
        if: github.event_name == 'push'
        run: |
          SERVICES="eureka-service student-service teacher-service course-service student-client teacher-client course-client gateway-service"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          for SERVICE in $SERVICES; do
            echo "Building $SERVICE..."

            JAR_FILE=$(find "$SERVICE/target" -name "*-exec.jar" | head -1)

            if [ -z "$JAR_FILE" ]; then
              JAR_FILE=$(find "$SERVICE/target" -name "*.jar" -not -name "*-sources.jar" | head -1)
            fi

            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: No jar file found for $SERVICE"
              exit 1
            fi

            echo "Found jar: $JAR_FILE"
            cp "$JAR_FILE" "jwts/$SERVICE/$SERVICE.jar"

            sudo nerdctl build \
              -t "$REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:$IMAGE_TAG" \
              -t "$REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest" \
              "jwts/$SERVICE/"

            sudo nerdctl push "$REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:$IMAGE_TAG"
            sudo nerdctl push "$REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest"

            echo "$SERVICE pushed successfully!"
          done

      - name: Deploy to K8s
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          sudo mkdir -p /home/github-runner/.kube
          sudo cp /root/.kube/config /home/github-runner/.kube/config
          sudo chown -R github-runner:github-runner /home/github-runner/.kube

          SERVICES="eureka-service student-service teacher-service course-service student-client teacher-client course-client gateway-service"

          for SERVICE in $SERVICES; do
            echo "Updating $SERVICE..."
            kubectl set image deployment/$SERVICE \
              "$SERVICE=$REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:$IMAGE_TAG" \
              -n jwts
          done

          echo "Waiting for rollout to complete..."
          for SERVICE in $SERVICES; do
            kubectl rollout status deployment/$SERVICE -n jwts --timeout=300s
          done

          kubectl get pods -n jwts -o wide

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            */target/*.jar
          retention-days: 7
