name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jwts

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        run: |
          # 检查 JDK 是否已安装
          if ! command -v java &> /dev/null; then
            echo "Installing JDK 8..."
            sudo apt-get update
            sudo apt-get install -y openjdk-8-jdk
          fi

          # 设置 JAVA_HOME
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH

          # 验证 Java 版本
          /usr/lib/jvm/java-8-openjdk-amd64/bin/java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Tests
        run: mvn test

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker images
        run: |
          # 定义服务列表
          SERVICES="eureka-service student-service teacher-service course-service student-client teacher-client course-client gateway-service"

          # 将镜像名称转换为小写
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          for SERVICE in $SERVICES; do
            echo "Building $SERVICE..."

            # 查找 jar 文件
            JAR_FILE=$(find $SERVICE/target -name "*.jar" -not -name "*-sources.jar" | head -1)

            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: No jar file found for $SERVICE"
              exit 1
            fi

            echo "Found jar: $JAR_FILE"

            # 复制 jar 文件到 Dockerfile 目录
            cp "$JAR_FILE" "jwts/$SERVICE/$SERVICE.jar"

            # 构建镜像
            nerdctl build -t $REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest jwts/$SERVICE/

            # 推送镜像
            nerdctl push $REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest

            echo "$SERVICE pushed successfully!"
          done

      - name: Deploy to K8s
        run: |
          # 将镜像名称转换为小写
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          # 更新所有 Deployment
          SERVICES="eureka-service student-service teacher-service course-service student-client teacher-client course-client gateway-service"

          for SERVICE in $SERVICES; do
            echo "Updating $SERVICE..."
            kubectl set image deployment/$SERVICE $SERVICE=$REGISTRY/$IMAGE_NAME_LOWER/$SERVICE:latest -n jwts
          done

          # 等待更新完成
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment -n jwts --timeout=300s

          # 查看 Pod 状态
          echo "Current pod status:"
          kubectl get pods -n jwts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            */target/*.jar
          retention-days: 7
